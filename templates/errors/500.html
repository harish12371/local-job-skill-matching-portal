{% extends "base.html" %}

{% block title %}Server Error (500) - Local Job & Skill Matching Portal{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="brand-icon-box mx-auto mb-4 bg-secondary text-white" style="width: 80px; height: 80px; font-size: 2.5rem;">
        <i class="bi bi-gear-wide-connected"></i>
    </div>
    <h1 class="fw-bold display-4 mb-2">500</h1>
    <h3 class="fw-semibold text-secondary mb-3">Internal Server Error</h3>
    <p class="text-muted mx-auto mb-4" style="max-width: 480px;">
        Something went wrong on our end. Please try refreshing the page or contact support if the issue persists.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom px-4 py-2">
        <i class="bi bi-house-door me-2"></i> Return to Home
    </a>
</div>
{% endblock %}
