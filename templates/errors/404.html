{% extends "base.html" %}

{% block title %}Page Not Found (404) - Local Job & Skill Matching Portal{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="brand-icon-box mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.5rem; background: var(--bg-alt); color: var(--text-muted); border: 2px dashed #cbd5e1;">
        <i class="bi bi-compass"></i>
    </div>
    <h1 class="fw-bold display-4 mb-2">404</h1>
    <h3 class="fw-semibold text-secondary mb-3">Page Not Found</h3>
    <p class="text-muted mx-auto mb-4" style="max-width: 480px;">
        The page you are looking for might have been moved, renamed, or is temporarily unavailable.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom px-4 py-2">
        <i class="bi bi-house-door me-2"></i> Return to Home
    </a>
</div>
{% endblock %}
